# 아이폰 앱 프로젝트 설정. xcodegen으로 GrowLog.xcodeproj를 만든다.
# 웹 앱은 저장소 맨 위의 파일을 그대로 쓰고, 빌드할 때 앱 안의 www 폴더로 복사한다.
name: GrowLog
options:
  developmentLanguage: ko
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 9Q67LFB7VF
targets:
  GrowLog:
    type: application
    platform: iOS
    sources:
      - path: GrowLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minheee.growlog
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: GrowLog/Info.plist
      properties:
        CFBundleDisplayName: 그로우로그
        CFBundleLocalizations: [ko]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    postCompileScripts:
      - name: Copy web app
        basedOnDependencyAnalysis: false
        script: |
          set -e
          cd "$SRCROOT/.."
          WWW="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/www"
          mkdir -p "$WWW"
          rsync -a --delete index.html manifest.webmanifest css icons js "$WWW/"
