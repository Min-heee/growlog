<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="운동·공부·수면·회복과 계획을 한곳에서 챙기는 자기계발 도구">
  <title>그로우로그</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="그로우로그">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#0a0b0d">
  <script>
    // 라이트 테마를 고른 사람에게 어두운 화면이 먼저 비치지 않게 그리기 전에 테마를 정한다
    try {
      document.documentElement.dataset.theme = JSON.parse(localStorage.getItem('growlog:v1')).theme;
    } catch {}
  </script>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="#/today" aria-label="그로우로그 오늘 화면">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 28V15" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/><path d="M16 17c0-6 4-10 11-10 0 7-4 11-11 10Z" fill="currentColor"/><path d="M16 20c0-4-3-7-9-7 0 5 3 8 9 7Z" fill="currentColor"/></svg>
        <span id="top-label">그로우로그</span>
      </a>
      <a class="help-link" href="#/help">많이 힘들어요</a>
    </header>
    <nav class="tabs" aria-label="주요 메뉴">
      <a class="tab" href="#/today" data-nav="today">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.5"/></svg>
        <span>오늘</span>
      </a>
      <a class="tab" href="#/calendar" data-nav="calendar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14.5" rx="3"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg>
        <span>달력</span>
      </a>
      <a class="tab" href="#/timer" data-nav="timer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 2M9.5 2.5h5"/></svg>
        <span>타이머</span>
      </a>
      <a class="tab" href="#/stats" data-nav="stats">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-6M12 20V5M19 20v-10"/></svg>
        <span>통계</span>
      </a>
      <a class="tab" href="#/recovery" data-nav="recovery">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12.5h4l2.5-6 4.5 12 2.5-6h4.5"/></svg>
        <span>내 상태</span>
      </a>
      <a class="tab" href="#/settings" data-nav="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h9M19 8h1M20 16h-9M5 16H4"/><circle cx="16" cy="8" r="2.5"/><circle cx="8" cy="16" r="2.5"/></svg>
        <span>설정</span>
      </a>
    </nav>
    <div id="save-warning" class="save-warning" role="alert" hidden>기록을 저장하지 못하고 있어요. 저장 공간을 확인하고, 설정에서 백업을 받아두세요.</div>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="announce" class="sr-only" aria-live="polite"></div>
</body>
</html>
