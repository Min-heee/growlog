<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="운동·공부·개발·수면·번아웃을 한곳에서 기록하는 자기계발 도구">
  <title>그로우로그</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="그로우로그">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="#/today"><span class="brand-mark" aria-hidden="true">🌱</span>그로우로그</a>
      <nav class="tabs" aria-label="주요 메뉴">
        <a class="tab" href="#/today" data-nav="today">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6L6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>
          <span>오늘</span>
        </a>
        <a class="tab" href="#/timer" data-nav="timer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 10v3.5l2.5 2M9.5 2.5h5"/></svg>
          <span>타이머</span>
        </a>
        <a class="tab" href="#/stats" data-nav="stats">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 20.5h17M7 16.5v-5M12 16.5V5M17 16.5v-8"/></svg>
          <span>통계</span>
        </a>
        <a class="tab" href="#/burnout" data-nav="burnout">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="7" width="16.5" height="10" rx="2.5"/><path d="M21.5 10.5v3M6.5 10.5v3M10 10.5v3"/></svg>
          <span>번아웃</span>
        </a>
        <a class="tab" href="#/settings" data-nav="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h9M19 6.5h1M4 12h3M11 12h9M4 17.5h11"/><circle cx="16" cy="6.5" r="2.2"/><circle cx="9" cy="12" r="2.2"/><circle cx="18" cy="17.5" r="2.2"/></svg>
          <span>설정</span>
        </a>
      </nav>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
